<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan Web02</title>

  <!-- Menghubungkan HTML dengan CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="frame">
    <form action="#" method="post">
      <table>
        <tr>
          <td><label for="name">Name:</label></td>
          <td>
            <input type="text" id="name" name="name" value="you name here">
          </td>
        </tr>

        <tr>
          <td><label for="email">Email:</label></td>
          <td>
            <input type="email" id="email" name="email" value="your email here">
          </td>
        </tr>

        <tr>
          <td><label for="address">Address:</label></td>
          <td>
            <textarea id="address" name="address">25 Nowhere Street
Somewhere
Not Here
Y2K 5RU</textarea>
          </td>
        </tr>

        <tr>
          <td><label for="postcode">Postcode:</label></td>
          <td>
            <input type="text" id="postcode" name="postcode" value="postal code">
          </td>
        </tr>
      </table>
    </form>
  </div>

</body>
</html>
